# Testi visibili in pagina. La vista li legge con {i18n>nome}.
# La a accentata di Priorita' e' scritta \u00e0: in pagina si legge con l'accento.

# Titolo in alto
appTitle=Elenco task
# Testo grigio dentro il campo di ricerca, prima che l'utente scriva
searchPlaceholder=Cerca nella descrizione...
# Frase sotto il campo di ricerca
searchHint=La ricerca mostra solo i task la cui descrizione contiene il testo inserito.
# Titolo del riquadro filtri
filtersTitle=Filtri
# Etichetta e suggerimento del filtro descrizione
description=Descrizione
descriptionPlaceholder=Contiene...
# Etichette delle date
startDate=Data di inizio
endDate=Data di fine
# Etichetta del menu priorita'
priority=Priorit\u00e0
# Etichetta del menu persona
responsible=Persona responsabile
# Voce che non filtra (priorita' e persona)
all=Tutte
# Voci del menu priorita'. La chiave nel codice resta Alta, Media, Bassa.
priorityHigh=Alta
priorityMedium=Media
priorityLow=Bassa
# Pulsante che svuota ricerca e filtri
clear=Pulisci
# Titolo sopra la tabella
tableTitle=Task
# {0} viene sostituito dal controller con il numero di righe visibili
resultCount=Visibili: {0}
# Messaggio quando ricerca o filtri non trovano task
noDataText=Nessun task corrisponde alla ricerca o ai filtri.
# Pulsante sulla riga del task
detailColumn=Approfondisci
showDetail=Approfondisci
hideDetail=Chiudi
# Sezione sotto il task, visibile dopo Approfondisci
projectSection=Progetto
projectName=Nome progetto
projectCode=Codice progetto
projectStartDate=Data inizio del progetto
projectEndDateZero=Data fine stimata al tempo zero
projectEndDateUpdated=Data fine del progetto aggiornata
